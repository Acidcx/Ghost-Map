name: Build Windows exe

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write  # attach the exe to a GitHub Release when a v* tag is pushed

jobs:
  windows-exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -c packaging/exe-constraints.txt . pyinstaller
      - run: python packaging/build_exe.py

      - name: Smoke test
        shell: pwsh
        run: |
          .\dist\GhostMap.exe --version
          $env:GHOSTMAP_DATA = "$env:RUNNER_TEMP\ghostmap"
          $p = Start-Process -FilePath .\dist\GhostMap.exe -ArgumentList "web","--demo" -PassThru
          $ok = $false
          foreach ($i in 1..30) {
            Start-Sleep -Seconds 1
            try { $r = Invoke-RestMethod http://127.0.0.1:8470/api/scans; if ($r.Count -ge 2) { $ok = $true; break } } catch {}
          }
          $ua = $false
          if ($ok) {
            # The demo also starts a simulated OPC UA server; connecting proves asyncua was bundled.
            try {
              $h = @{ "X-Ghostmap" = "1" }
              $info = Invoke-RestMethod http://127.0.0.1:8470/api/info
              $body = @{ url = $info.demo_opcua } | ConvertTo-Json
              $c = Invoke-RestMethod -Method Post -Uri http://127.0.0.1:8470/api/opcua/connect -Headers $h -ContentType "application/json" -Body $body
              $ua = [bool]$c.sid
            } catch { Write-Host $_ }
          }
          $sql = $false
          if ($ok) {
            # The SQL driver is bundled: a connection to a closed port fails with a network error, not a missing
            # module. Saving a password proves DPAPI works in the exe. The build info names the commit.
            try {
              $h = @{ "X-Ghostmap" = "1" }
              $cfg = @{ server = "127.0.0.1,9"; database = "TSC"; username = "ro"; password = "smoke-test" } | ConvertTo-Json
              $t = Invoke-RestMethod -Method Post -Uri http://127.0.0.1:8470/api/tsc/test -Headers $h -ContentType "application/json" -Body $cfg
              Write-Host "TSC test: $($t.error)"
              $s = Invoke-RestMethod -Method Post -Uri http://127.0.0.1:8470/api/tsc/config -Headers $h -ContentType "application/json" -Body $cfg
              $saved = Get-Content "$env:GHOSTMAP_DATA\tsc.json" -Raw
              $info = Invoke-RestMethod http://127.0.0.1:8470/api/info
              Write-Host "build: $($info.build | ConvertTo-Json -Compress)"
              $sql = (-not $t.ok) -and ($t.error -notmatch "ModuleNotFound|ImportError") -and $s.has_password -and ($saved -match '"dpapi:') -and ($saved -notmatch "smoke-test") -and [bool]$info.build.commit
            } catch { Write-Host $_ }
          }
          Stop-Process -Id $p.Id -Force
          if (-not $ok) { throw "web UI did not come up" }
          if (-not $ua) { throw "OPC UA tag browser did not connect to the demo server" }
          if (-not $sql) { throw "TSC SQL link, DPAPI password or build info failed in the exe" }
          Write-Host "web UI, OPC UA and TSC OK"

      - name: Windows service smoke test
        shell: pwsh
        run: |
          # The exe from the step above must be gone (the onefile child process too) before the service takes the port.
          Get-Process GhostMap -ErrorAction SilentlyContinue | Stop-Process -Force
          Start-Sleep -Seconds 2
          # Something in ~/.ghostmap to carry over to C:\ProgramData\GhostMap.
          New-Item -ItemType Directory -Force "$env:USERPROFILE\.ghostmap" | Out-Null
          '{"smoke": true}' | Set-Content "$env:USERPROFILE\.ghostmap\smoke-carried-over.json"
          .\dist\GhostMap.exe service install
          if ($LASTEXITCODE -ne 0) {
            Get-Content C:\ProgramData\GhostMap\logs\ghostmap.log -ErrorAction SilentlyContinue
            Get-WinEvent -LogName System -MaxEvents 15 | Where-Object ProviderName -eq "Service Control Manager" | Format-List TimeCreated, Message
            throw "service install failed ($LASTEXITCODE)"
          }
          $info = Invoke-RestMethod http://127.0.0.1:8470/api/info
          if ($info.data_dir -ne "C:\ProgramData\GhostMap") { throw "the service uses $($info.data_dir), not C:\ProgramData\GhostMap" }
          if (-not (Test-Path "C:\Program Files\GhostMap\GhostMap.exe")) { throw "the exe was not copied to Program Files" }
          if (-not (Test-Path "C:\ProgramData\GhostMap\smoke-carried-over.json")) { throw "~/.ghostmap was not carried over" }
          $svc = Get-CimInstance Win32_Service -Filter "Name='GhostMap'"
          Write-Host "service: $($svc.State), $($svc.StartMode), $($svc.StartName), $($svc.PathName)"
          sc.exe qfailure GhostMap
          if ($svc.StartName -ne "LocalSystem" -or $svc.StartMode -ne "Auto") { throw "unexpected account or start mode" }
          # Kill it: Windows' recovery actions must start it again (10 s after the first failure).
          Get-Process GhostMap -ErrorAction SilentlyContinue | Stop-Process -Force
          $back = $false
          foreach ($i in 1..60) {
            Start-Sleep -Seconds 1
            $now = Get-CimInstance Win32_Service -Filter "Name='GhostMap'"
            if ($now.State -eq "Running" -and $now.ProcessId -ne $svc.ProcessId) {
              try { Invoke-RestMethod http://127.0.0.1:8470/api/info | Out-Null; $back = $true; break } catch {}
            }
          }
          if (-not $back) { throw "the service was not restarted after its process was killed" }
          if (-not [System.Diagnostics.EventLog]::SourceExists("GhostMap")) { throw "the GhostMap event log source was not registered" }
          # Upgrade in place to HTTPS: the self-signed certificate is made in ProgramData and the service serves it.
          .\dist\GhostMap.exe service install --https
          if ($LASTEXITCODE -ne 0) { throw "service install --https failed ($LASTEXITCODE)" }
          $tlsInfo = Invoke-RestMethod https://127.0.0.1:8470/api/info -SkipCertificateCheck
          $cert = [System.Security.Cryptography.X509Certificates.X509Certificate2]::new("C:\ProgramData\GhostMap\tls\ghostmap.crt")
          $want = ($cert.GetCertHashString([System.Security.Cryptography.HashAlgorithmName]::SHA256) -split '(..)' -ne '') -join ':'
          if (-not $tlsInfo.https -or $tlsInfo.tls.sha256 -ne $want) { throw "the service does not serve its certificate ($($tlsInfo.tls.sha256) vs $want)" }
          Write-Host "HTTPS: $($cert.Subject), SHA-256 $want"
          .\dist\GhostMap.exe service status
          .\dist\GhostMap.exe service stop
          if ($LASTEXITCODE -ne 0) { throw "service stop failed" }
          .\dist\GhostMap.exe service uninstall
          if (Get-Service GhostMap -ErrorAction SilentlyContinue) { throw "the service is still registered" }
          if (-not (Test-Path "C:\ProgramData\GhostMap\history.db")) { throw "uninstall should keep the data" }
          Write-Host "Windows service: install, data carried over, restart after a crash, HTTPS upgrade, stop and uninstall OK"

      - uses: actions/upload-artifact@v4
        with:
          name: GhostMap-windows
          path: dist/GhostMap.exe

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/GhostMap.exe
