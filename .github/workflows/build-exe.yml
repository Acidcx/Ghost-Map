name: Build Windows exe

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write  # attach the exe to a GitHub Release when a v* tag is pushed

jobs:
  windows-exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install . pyinstaller
      - run: python packaging/build_exe.py

      - name: Smoke test
        shell: pwsh
        run: |
          .\dist\GhostMap.exe --version
          $env:GHOSTMAP_DATA = "$env:RUNNER_TEMP\ghostmap"
          $p = Start-Process -FilePath .\dist\GhostMap.exe -ArgumentList "web","--demo" -PassThru
          $ok = $false
          foreach ($i in 1..30) {
            Start-Sleep -Seconds 1
            try { $r = Invoke-RestMethod http://127.0.0.1:8470/api/scans; if ($r.Count -ge 2) { $ok = $true; break } } catch {}
          }
          Stop-Process -Id $p.Id -Force
          if (-not $ok) { throw "web UI did not come up" }
          Write-Host "web UI OK"

      - uses: actions/upload-artifact@v4
        with:
          name: GhostMap-windows
          path: dist/GhostMap.exe

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/GhostMap.exe
