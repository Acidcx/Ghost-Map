[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ghostmap"
version = "0.2.0"
description = "Read-only OT network mapper and commissioning/debug tool for EtherNet/IP devices and Stratix switches."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "pysnmp>=7.1",
    "asyncua>=1.1",
    "python-tds>=1.15",  # TSC part schedule on SQL Server, read-only; pure Python, no ODBC driver needed
    "pyOpenSSL>=23",     # encrypted SQL Server connections through python-tds
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
ghostmap = "ghostmap.cli:main"

[tool.setuptools.packages.find]
include = ["ghostmap*"]

[tool.setuptools.package-data]
ghostmap = ["web/static/*", "data/*.json", "data/*.gz"]

[tool.pytest.ini_options]
testpaths = ["tests"]
